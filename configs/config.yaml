data:
  # 数据集名称，当前支持 cifar10 / cifar100
  data_name: cifar10

  # 原始数据下载或读取目录
  data_path: ./data

  # DataLoader 的 batch size
  batch_size: 32

  # Dirichlet 划分后，每个客户端至少要有多少条训练样本
  min_datasize: 32

  # Dirichlet 分布参数，越小表示客户端间数据越不均匀；
  # 官方 train 会全部按这个参数划分给各客户端
  alpha: 0.5

  # 全局随机种子，控制数据划分和训练可复现性
  seed: 1

  # 索引划分协议文件名；
  # 当前协议只保存 client_train_indices 和 global_test_indices
  partition_meta_name: partition_meta.pt

  # 划分统计信息文件名；
  # official test 由 server 持有，训练结束后只在 global_test 上评估一次
  partition_stats_name: partition_stats.json

  # DataLoader 的子进程数量，0 表示主进程加载
  num_workers: 16

  # 是否为 DataLoader 开启 pinned memory，加速 CPU->GPU 拷贝
  pin_memory: true

model:
  # 模型类型：
  # hybrid_switch_transformer = CNN stem + Transformer
  # switch_transformer = patch embedding + Transformer
  # resnet18_switch_transformer = ResNet-18 backbone + Switch Transformer
  # resnet20_switch_transformer = ResNet-20 backbone + Transformer
  # resnet32_switch_transformer = ResNet-32 backbone + Transformer
  model_type: resnet18_switch_transformer

  # 标准 switch_transformer 的显式 patch 大小；
  # 为 null 时会回退到兼容逻辑，根据 token_grid_size 推导
  # 该字段只对 switch_transformer 生效
  patch_size: null

  # 每个 Switch FFN 中的专家数量
  num_experts: 8

  # Transformer / MLP 中使用的 dropout 比例
  dropout: 0.1

  # 优化器学习率
  learning_rate: 0.0005

  # 优化器类型：
  # - adam: 旧默认行为，使用 torch.optim.Adam
  # - adamw: 推荐用于 ResNet/MoE 训练，配合 weight_decay 提高泛化
  optimizer: adamw

  # 权重衰减系数：
  # - adam 默认可以设 0.0 保持旧行为
  # - adamw 推荐先试 0.0001
  weight_decay: 0.0001

  # 学习率调度方式：
  # - constant: 全程固定 learning_rate
  # - cosine: 按 server round 做全局余弦退火，不是按 local epoch 或 batch
  # - warmup_cosine: 前 warmup_rounds 个 server round 线性升温，然后余弦退火
  lr_schedule: warmup_cosine

  # cosine 退火的最低学习率；建议先用初始学习率的 1/10，不要直接退到 0
  min_learning_rate: 0.00005

  # warmup 轮数，仅当 lr_schedule=warmup_cosine/cosine_warmup/linear_warmup_cosine 时使用。
  # 推荐 CIFAR10 + ResNet/MoE 先试 5；如果前期收敛太慢可试 3。
  warmup_rounds: 5

  # warmup 初始学习率，仅当 warmup_cosine 生效。
  # 推荐先用 base learning_rate 的 20%，例如 learning_rate=0.0005 时设为 0.0001。
  warmup_start_learning_rate: 0.0001

  # token / hidden 的嵌入维度
  embed_dim: 128

  # 多头注意力的头数
  num_heads: 4

  # FFN 隐藏层扩张倍数，hidden_dim = embed_dim * mlp_ratio
  mlp_ratio: 4.0

  # Transformer block 总层数
  depth: 4

  # depth 的别名；如果不是 null，会优先使用它覆盖 depth
  num_layers: null

  # 哪些层使用 MoE/Switch FFN，字符串形式，例如 "1,3"
  moe_layers: "1,3"

  # 每个 token 选择的专家数量，当前项目实际按 top-1 使用
  top_k: 1

  # router auxiliary loss 的权重系数
  router_aux_loss_coef: 0.01

  # router z-loss 的权重系数
  router_z_loss_coef: 0.001

  # 训练时 router 输入抖动噪声强度
  router_jitter_noise: 0.0

  # expert capacity 系数，用于控制每个 expert 一轮可接收多少 token
  capacity_factor: 1.25

  # 每个 expert 的最小 capacity
  min_capacity: 4

  # token 超过 expert capacity 时是否丢弃
  drop_tokens: true

  # Hybrid 模型 CNN stem 的通道数；标准 switch_transformer 不使用该字段
  stem_channels: 64

  # token 网格边长：
  # 对 Hybrid 表示 token pooling 后的网格边长；
  # 对标准 Switch 在 patch_size 为 null 时可用于推导 patch 大小
  token_grid_size: 8

  # 是否使用 cls token 做分类；false 时用 token mean pooling
  use_cls_token: false

train:
  # 联邦学习中的客户端数量
  num_clients: 10

  # 服务端通信轮数，也就是全局训练轮数
  server_epochs: 80

  # 每轮中每个客户端本地训练的 epoch 数
  client_epochs: 2

  # 训练设备，例如 cpu 或 cuda
  device: cuda

  # 实验输出根目录；最终会派生出 save/{run_name}/data|model|result
  save_root: save

  # 实验名称。新实验只需要改这个字段，例如 exp7
  run_name: default

  # 是否允许复用已有且非空的输出目录；false 可防止误覆盖
  allow_overwrite: false

  # 是否显示一个总训练进度条；当前只显示总进度，不显示嵌套进度条
  # 后台运行、重定向日志或输出混乱时，可以设为 false
  show_progress: true

  # 训练结束后是否在终端保留总进度条，便于查看总耗时和平均速度
  progress_leave: true

  # 是否每轮保存每个客户端的本地模型 {client_id}.pth。
  # false: 默认，不保存客户端模型，server 直接使用 Client.train() 返回的 state_dict 聚合，减少磁盘 I/O。
  # true: 调试/兼容旧流程时保存客户端模型。
  save_client_models: false

  # DataLoader 随机流控制模式：
  # - legacy: 保持旧行为，不显式传 generator / worker_init_fn
  # - round_client: 为 client / round 构造可复现但不同的随机流，正式复现实验建议使用
  dataloader_seed_mode: round_client

  # 聚合方法：
  # - fedavg: 全模型按样本数 FedAvg。
  # - expert_fedavg: shared/router 按样本数 FedAvg，expert 按 usage 加权。
  # - fedwolf_fisher_only: 旧 Fisher-only baseline，只用 raw Fisher score s，不用 WoLF filter。
  # - fedwolf: FedWoLF 入口，具体 expert 聚合由 fedwolf_fusion_mode 决定：
  #   * evidence_filter_block_precision: 旧路径，使用 s/z、mu/P filter、lambda_clients 等聚合 expert。
  #   * robust_update_fusion: 新路径，聚合 client update delta_m = theta_m - theta_old，
  #     支持 uniform_update / fisher_only / robust_only / fisher_wolf。
  #   若某个 expert 参数没有有效客户端更新，则保留旧 global expert。
  agg_method: fedwolf

  # FedWoLF 融合模式：默认走旧版 evidence/filter 路径。
  fedwolf_fusion_mode: robust_update_fusion

  # 仅当 fedwolf_fusion_mode == robust_update_fusion 时使用的 update fusion 变体。
  # 可选值：uniform_update, fisher_only, robust_only, fisher_wolf。
  fedwolf_update_fusion_variant: uniform_update

  # robust_only / fisher_wolf 使用的 IRLS 风格重加权迭代次数。
  fedwolf_irls_steps: 2

  # robust_update_fusion 变体使用的数值稳定项 epsilon。
  fedwolf_update_fusion_eps: 1.0e-12

  # 聚合设备：
  # - cpu: 在 CPU 上聚合，显存更稳，但聚合可能较慢。
  # - cuda: 在 GPU 上聚合；多 GPU 时优先跟随训练 device，避免跑到错误默认卡。
  # - cuda:0 / cuda:1: 显式指定聚合使用的 GPU。
  # 仅聚合阶段临时迁移浮点 tensor；聚合结果会转回 CPU state_dict。
  # 非浮点 buffer 不做加权平均，沿用第一个客户端的值。
  aggregation_device: cuda

  # FedWoLF expert Fisher evidence 使用的数据加载模式：
  # - deterministic: 使用确定性 transform，不做随机增强，不 shuffle
  # - train_loader: 复用训练 loader，包含随机增强和 shuffle，用于消融
  fedwolf_evidence_loader_mode: deterministic

  # 是否在 deterministic evidence 模式下，把 Fisher evidence batch 预加载到 GPU。
  # 只有 fedwolf_evidence_loader_mode=deterministic 且 device=cuda 时才会启用。
  # 该选项只缓存 inputs/labels，不缓存模型输出，不改变 Fisher 算法语义。
  fedwolf_fisher_cache_evidence_gpu: true

  # FedWoLF expert Fisher evidence 的模型模式：
  # - eval: 关闭 Dropout/BN 更新等训练态随机行为，但仍保留梯度计算
  # - train: 使用训练模式计算 evidence，更贴近训练态但随机性更强
  fedwolf_evidence_model_mode: eval

  # FedWoLF/Fisher evidence 的计算器：
  # - per_sample_backward: 旧实现；逐样本 backward 后累计 expert 参数 grad^2，语义稳但速度慢
  # - linear_hook_token_fast: token-level fast Fisher
  # - linear_hook_sample_fast: sample-grouped fast Fisher
  fedwolf_fisher_estimator: linear_hook_sample_fast

  # FedWoLF/Fisher evidence 标量压缩方式：
  # - mean_diag: 旧逻辑/PDF 对齐，grad_square_sum / (param_count * total_samples)
  # - mean_diag_active: 只在该 expert 有梯度的样本上做 mean diagonal
  # - trace_per_sample: 不除以参数量，只按 total_samples 平均
  # - trace_per_active_sample: 不除以参数量，只按该 expert 有梯度的样本数平均
  # - trace_raw: 不做平均，直接使用 grad_square_sum，仅用于消融
  fedwolf_fisher_score_mode: trace_per_active_sample

  # 每个 client 的 Fisher evidence pass 最多使用多少样本：
  # - null 或 0: 不限制，使用该 client 的全部 evidence 数据
  # - 正整数: 最多使用这么多样本；调试阶段可用 512/1024 加速
  fedwolf_fisher_max_samples: 1024

  # 每个 client 的 Fisher evidence pass 最多处理多少 batch：
  # - null 或 0: 不限制
  # - 正整数: 最多处理这么多个 evidence batch；若 max_samples 同时设置，先到任一上限就停止
  fedwolf_fisher_max_batches: null

  # Fisher evidence 逐 batch 诊断记录数量：
  # - 0: 不记录逐 batch 诊断，只保留 summary
  # - N>0: 只记录前 N 个 batch
  fedwolf_fisher_debug_batches: 0

  # 是否打印完整 Fisher diagnostics：
  # - false: 正式实验默认，只打印精简 summary，不打印完整 diagnostics
  # - true: 调试模式，打印完整 diagnostics，包括 batch_grad_status 等字段
  fedwolf_fisher_debug: false












  # 以下参数主要用于旧 evidence_filter_block_precision 路径。
  # robust_update_fusion 不使用旧 mu/P filter、low_only residual、
  # lambda_clients、support gate、block_fisher_power、update consistency 这套逻辑。
  # 旧 FedWoLF 数值稳定项；用于 Fisher 权重归一化、观测噪声分母等，防止除零
  fedwolf_eps: 1e-8
  # 旧 FedWoLF expert 可信度状态的过程噪声 q；越大表示跨轮状态允许更快漂移
  fedwolf_process_noise_q: 0.01
  # 旧 FedWoLF observation noise 基础尺度；
  # R = sigma_e2 / (sqrt(relative evidence active tokens) + eps)
  fedwolf_sigma_e2: 1e-4
  # 旧 FedWoLF WoLF-IMQ 鲁棒权重尺度 c；越小越容易对 residual 大的 evidence 降权
  fedwolf_imq_c: 0.1
  # 旧 FedWoLF IMQ rho 使用的 residual 模式：
  # - two_sided: 对 signed standardized residual 的正负偏离都降权
  # - low_only: 只惩罚低于历史预测的 Fisher evidence，高 evidence 不降权
  fedwolf_rho_residual_mode: low_only
  # 旧 evidence_filter_block_precision 路径中的 precision 粒度。
  # - scalar: 每个 client-expert 使用一个 scalar precision
  # - block: 每个 client-expert-parameter-block 使用一个 precision
  fedwolf_precision_granularity: block
  # 旧 evidence_filter_block_precision 路径中的 block Fisher precision 幂指数。
  fedwolf_block_fisher_power: 0.25
  # 旧 evidence_filter_block_precision 路径中的 support gate 模式。
  fedwolf_support_gate_mode: cap_one
  # 旧 FedWoLF 是否启用 leave-one-out update consistency。
  fedwolf_use_update_consistency: false
  # 旧 FedWoLF update consistency 的最低保留权重
  fedwolf_consistency_min: 0.1
  # 旧 FedWoLF normalized client-expert precision 的裁剪范围
  fedwolf_lambda_min: 0.05
  fedwolf_lambda_max: 5.0
