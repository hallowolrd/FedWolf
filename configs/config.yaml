data:
  # 数据集名称；当前精简 baseline 主要按 CIFAR10/CIFAR100 路径运行。
  data_name: cifar10

  # 原始 CIFAR 数据保存位置；data.data 会在这里读取或下载官方数据。
  data_path: ./data

  # 客户端本地训练使用的 batch size。
  batch_size: 64

  # 全局测试 DataLoader 使用的 batch size，对齐原始 moefedavg.py。
  eval_batch_size: 256

  # Dirichlet non-IID 划分参数；值越小，客户端类别分布越不均匀。
  alpha: 0.1

  # 全局随机种子，影响数据划分、模型初始化和训练随机性。
  seed: 42

  # DataLoader worker 数量；显存/CPU 紧张时可以调低。
  num_workers: 2

  # CUDA 训练时开启 pinned memory，加速 CPU 到 GPU 的数据拷贝。
  pin_memory: true

  # 使用 moefedavg.py 对齐的 Dirichlet 划分实现。
  partition_impl: moefedavg

model:
  # 精简版唯一支持的模型：ResNet backbone + sparse MoE 分类头。
  model_type: resnet_sparse_moe_head

  # MoE 分类头中的 expert 数量。
  num_experts: 4

  # 每个样本路由到 top-k 个 expert；baseline 对齐 top_k=2。
  top_k: 2

  # 客户端本地优化器学习率。
  learning_rate: 0.01

  # 当前 ResNetSparseMoEHead 不使用 dropout，保留该字段用于配置摘要。
  dropout: 0.0

  # 以下 router 辅助 loss 在 strict baseline 中必须保持 0，不参与训练。
  router_aux_loss_coef: 0.0
  router_z_loss_coef: 0.0
  router_balance_loss_coef: 0.0

train:
  # 联邦客户端数量；当前主线每轮所有客户端都参与训练。
  num_clients: 10

  # 服务端通信轮数；完整 baseline 跑 100 轮。
  server_epochs: 100

  # 每轮每个客户端本地训练 epoch 数。
  client_epochs: 1

  # 训练设备；无可用 GPU 时需要手动改为 cpu。
  device: cuda

  # 实验输出根目录，最终路径为 save/{run_name}/data|model|result。
  save_root: save

  # 本次实验名；改实验时优先改这里，避免覆盖旧输出。
  run_name: moefedavg_baseline

  # false 可防止误写已有非空输出目录。
  allow_overwrite: false

  # false 表示客户端模型通过内存返回给 server，不额外落盘每个 client.pth。
  save_client_models: false

  # 严格 baseline 聚合：完整 state_dict 做客户端等权平均。
  # 该模式不会读取 client_samples、Fisher、History-WoLF 或 routing stats。
  aggregation_mode: whole_model_uniform_avg

  # baseline 优化器配置，对齐 SGD + momentum + weight_decay。
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001

  # 梯度裁剪阈值；0 表示关闭，baseline 使用 5.0。
  grad_clip_norm: 5.0

  # CrossEntropyLoss 的 label_smoothing，strict baseline 保持 0。
  label_smooth: 0.0

  # split_expert 模式下才会使用；whole_model_uniform_avg 会忽略这两个字段。
  non_expert_agg_method: equal_avg
  expert_agg_method: equal_avg

  # Fisher / History-WoLF 聚合中的数值稳定项；whole_model_uniform_avg 不使用。
  fedwolf_eps: 1e-8
