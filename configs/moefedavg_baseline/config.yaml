data:
  data_name: cifar10
  data_path: ./data
  batch_size: 64
  alpha: 0.1
  seed: 42
  partition_meta_name: partition_meta.pt
  partition_stats_name: partition_stats.json
  num_workers: 2
  pin_memory: true
  partition_impl: moefedavg

model:
  model_type: resnet_sparse_moe_head
  num_experts: 4
  dropout: 0.0
  learning_rate: 0.01
  top_k: 2

  # Compatibility fields for other model builders; strict baseline does not use them.
  cnn_channels: [32, 64, 128]
  expert_hidden_dim: 256
  embed_dim: 128
  num_heads: 4
  mlp_ratio: 4.0
  depth: 4
  moe_layers: "1,3"
  token_grid_size: 8
  use_cls_token: false
  router_aux_loss_coef: 0.0
  router_z_loss_coef: 0.0
  router_balance_loss_coef: 0.0

train:
  num_clients: 10
  server_epochs: 100
  client_epochs: 1
  device: cuda
  save_root: save
  run_name: moefedavg_baseline_strict
  allow_overwrite: false
  save_client_models: false

  # Strict moefedavg.py reproduction path.
  aggregation_mode: whole_model_uniform_avg
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001
  grad_clip_norm: 5.0
  label_smooth: 0.0

  # Kept for compatibility; ignored when aggregation_mode=whole_model_uniform_avg.
  non_expert_agg_method: equal_avg
  expert_agg_method: equal_avg

  # Fisher / History-WoLF fields kept disabled for config compatibility.
  history_wolf_min_usage: 1
  history_wolf_c: 2.0
  history_wolf_process_noise: 0.01
  history_wolf_obs_noise: 0.05
  history_wolf_quadrant_log: false
  history_wolf_quadrant_threshold: 0.5
  history_wolf_quality_variant: legacy
  history_wolf_conflict_direction_weight: 0.60
  history_wolf_conflict_magnitude_weight: 0.25
  history_wolf_conflict_usage_weight: 0.15
  fedwolf_evidence_loader_mode: deterministic
  fedwolf_evidence_model_mode: eval
  fedwolf_fisher_estimator: linear_hook_token_fast
  fedwolf_fisher_score_mode: trace_per_active_sample
  fedwolf_fisher_debug_batches: 0
  fedwolf_fisher_debug: false
  fedwolf_eps: 1e-8
